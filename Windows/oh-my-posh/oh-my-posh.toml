#:schema https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

version = 2
final_space = true

# ═══════════════════════════════════════════════════════════════════════════
# PALETA CENTRALIZADA — mismos nombres que las variables locales de p10k.zsh
# (líneas 547-561). Edita un color aquí y se propaga a todos los segmentos
# que lo referencian con "p:nombre".
# ═══════════════════════════════════════════════════════════════════════════
[palette]
white = "#EBFAFA"
purple = "#7081D0"
cyan = "#04D1F9"
green = "#37F499"
orange = "#F7C67F"
pink = "#F265B5"
l_purple = "#A48CF2"
red = "#F16C75"
gold = "#F1FC79"
grey = "#323449"
violet = "#BD93F9"
sulfur = "#CCFF00"
coral = "#FF5E62"
mint = "#00FFCC"

[transient_prompt]
foreground = "p:l_purple"
background = "transparent"
template = "❯ "

# ═══════════════════════════════════════════════════════════════════════════
# BLOQUE 1: LÍNEA SUPERIOR (Ruta + Git a la izquierda | Estado + Tiempo a la derecha)
# ═══════════════════════════════════════════════════════════════════════════
[[blocks]]
type = "prompt"
alignment = "left"

# Segmento 1: Directorio
[[blocks.segments]]
type = "path"
style = "plain"
background = "transparent"
foreground = "p:cyan"
template = "{{ .Path }}"
[blocks.segments.properties]
style = "full"

# Segmento 2: Git — violeta base, rosa si hay cambios, sulfuro para ahead/behind
[[blocks.segments]]
type = "git"
style = "plain"
background = "transparent"
foreground = "p:violet"
foreground_templates = ["{{ if .Working.Changed }}p:pink{{ end }}"]
template = " {{ if .Working.Changed }}* {{ end }}{{ .HEAD }}{{ if .Behind }} <p:sulfur>⇣{{ .Behind }}</>{{ end }}{{ if .Ahead }} <p:sulfur>⇡{{ .Ahead }}</>{{ end }}"
[blocks.segments.properties]
branch_icon = ""
commit_icon = "@"
fetch_status = true

[[blocks]]
type = "prompt"
alignment = "right"

# Segmento Derecho 1: Estado de error
[[blocks.segments]]
type = "status"
style = "plain"
background = "transparent"
foreground = "p:red"
template = "✘"
[blocks.segments.properties]
always_enabled = false

# Segmento Derecho 2: Tiempo de ejecución
[[blocks.segments]]
type = "executiontime"
style = "plain"
background = "transparent"
foreground = "p:purple"
template = " {{ .FormattedMs }}"
[blocks.segments.properties]
threshold = 3000
style = "roundrock"

# ═══════════════════════════════════════════════════════════════════════════
# BLOQUE 2: LÍNEA INFERIOR (Fuerza el salto de línea definitivo para escribir abajo)
# ═══════════════════════════════════════════════════════════════════════════
[[blocks]]
type = "prompt"
alignment = "left"
newline = true

[[blocks.segments]]
type = "status"
style = "plain"
background = "transparent"
foreground = "p:l_purple"
foreground_templates = ["{{ if gt .Code 0 }}p:red{{ end }}"]
template = "❯ "
[blocks.segments.properties]
always_enabled = true
